<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0c1014">
    <meta
      name="description"
      content="Manchinn is the public link hub for Chinnakrit Sripan: portfolio, resume, GitHub, and LinkedIn."
    >
    <meta property="og:title" content="Manchinn">
    <meta
      property="og:description"
      content="Public links for Chinnakrit Sripan's portfolio, resume, GitHub, and LinkedIn."
    >
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://manchinn.github.io/">
    <meta property="og:image" content="https://github.com/Manchinn.png?size=420">
    <title>Manchinn</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://github.com">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/" aria-label="Manchinn home">Manchinn</a>
    </header>

    <main>
      <section class="hero reveal" aria-labelledby="hero-title">
        <div class="avatar-wrap">
          <img
            class="avatar"
            src="https://github.com/Manchinn.png?size=240"
            alt="Manchinn GitHub avatar"
            width="120"
            height="120"
            decoding="async"
          >
          <span class="avatar-fallback" hidden>MC</span>
        </div>

        <p class="kicker">Chinnakrit Sripan</p>
        <h1 id="hero-title">Manchinn</h1>
        <p class="lede">
          Public links for portfolio, resume, GitHub, and LinkedIn.
        </p>

        <div class="hero-actions" aria-label="Featured links">
          <a class="button primary" href="https://chinnakrit.dev" target="_blank" rel="noreferrer">Portfolio</a>
          <a class="button" href="/resume/">Resume</a>
          <a class="button" href="https://github.com/Manchinn" target="_blank" rel="noreferrer">GitHub</a>
          <a
            class="button"
            href="https://www.linkedin.com/in/chinnakrit-sripan-4674a436a/"
            target="_blank"
            rel="noreferrer"
          >
            LinkedIn
          </a>
        </div>
      </section>
    </main>

    <footer class="footer">
      <span>Manchinn</span>
      <span>AI automation and full-stack systems.</span>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
